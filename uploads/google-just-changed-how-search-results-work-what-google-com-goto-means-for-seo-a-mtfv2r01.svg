<path d="M782,388 C782,300 790,206 826,206" fill="none" stroke="#EF9F27" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M1012,206 C1050,206 1042,300 1042,386" fill="none" stroke="#EF9F27" stroke-width="2.5" marker-end="url(#ah)"/>

<rect x="832" y="170" width="176" height="70" rx="10" fill="#2A1F0C" stroke="#EF9F27" stroke-width="2"/>
