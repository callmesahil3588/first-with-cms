<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img">
<title>Google just changed how search result links work — google.com/goto</title>
<desc>Blog banner showing that Google search result links now detour through a google.com/goto redirect before reaching the destination page.</desc>

<rect x="0" y="0" width="1200" height="630" fill="#0E1116"/>
<rect x="0" y="0" width="8" height="630" fill="#EF9F27"/>

<rect x="680" y="0" width="520" height="630" fill="#12161D"/>
<rect x="680" y="0" width="1" height="630" fill="#232A34"/>

<rect x="72" y="82" width="316" height="38" rx="19" fill="#2A1F0C" stroke="#6B4C12" stroke-width="1"/>
<circle cx="94" cy="101" r="4" fill="#EF9F27"/>
<text x="108" y="107" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="15" fill="#FAC775" letter-spacing="0.3">Google Search update &#183; 26 Aug 2026</text>

<text x="72" y="212" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#F5F3EE">Google just changed how</text>
<text x="72" y="262" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#F5F3EE">search result links work</text>

<text x="72" y="352" font-family="DejaVu Sans Mono, monospace" font-size="46" fill="#EF9F27">google.com/goto</text>
<rect x="72" y="368" width="418" height="3" fill="#6B4C12"/>

<text x="72" y="424" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="21" fill="#9C9A92">What it means for SEO, rank tracking,</text>
<text x="72" y="454" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="21" fill="#9C9A92">AI visibility and your reporting.</text>

<rect x="72" y="516" width="46" height="2" fill="#EF9F27"/>
<text x="72" y="556" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="16" fill="#6E6C66">Confirmed by Google &#183; nothing to fix on your site</text>

<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#EF9F27" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
